<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceCut – cutting marks from a photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="top">
  <h1>TraceCut</h1>
  <p>Upload a garment photo. Get cutting lines, seam allowance and step-by-step instructions.</p>
</header>

<main class="layout">
  <aside class="panel controls">
    <h2>Marking style</h2>
    <label>Garment length (cm)<input id="ref" type="number" min="5" max="300" step="0.5" value="70"></label>
    <label>Seam allowance (cm)<input id="seam" type="number" min="0" max="10" step="0.1" value="1.5"></label>
    <div class="row">
      <label>Cut line color<input id="color" type="color" value="#ff4d7d"></label>
      <label>Seam color<input id="seamColor" type="color" value="#f5b800"></label>
    </div>
    <label>Detail line color<input id="detailColor" type="color" value="#2b6cf0"></label>
    <label>Line width <output id="widthOut">3</output> px<input id="width" type="range" min="1" max="10" value="3"></label>
    <label>Line style
      <select id="style"><option value="solid">Solid</option><option value="dashed">Dashed</option><option value="dotted">Dotted</option></select>
    </label>
    <label>Photo opacity<input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.55"></label>
    <h2>Pattern details</h2>
    <label>Fabric
      <select id="fabric"><option value="cotton">Cotton</option><option value="denim">Denim</option><option value="silk">Silk / satin</option><option value="knit">Knit / jersey</option><option value="wool">Wool</option></select>
    </label>
    <label>Pieces to cut
      <select id="qty"><option value="1">1 piece</option><option value="2">2 pieces (mirrored)</option><option value="fold">1 piece on fold</option></select>
    </label>
    <div class="checks">
      <label><input id="fill" type="checkbox" checked> Fill piece</label>
      <label><input id="details" type="checkbox" checked> Inner detail lines</label>
      <label><input id="guides" type="checkbox" checked> Width guides</label>
      <label><input id="grain" type="checkbox" checked> Grainline</label>
      <label><input id="notch" type="checkbox" checked> Notches</label>
      <label><input id="dims" type="checkbox" checked> Measurements</label>
    </div>
    <div class="btns">
      <button id="download" class="primary" disabled>Download marked PNG</button>
      <button id="reset" class="ghost">New image</button>
    </div>
  </aside>

  <section class="panel stage-wrap">
    <div id="stage" class="stage">
      <label id="drop" class="drop">
        <input id="file" type="file" accept="image/*" hidden>
        <strong>Drop a clothing photo here</strong>
        <span>or click to browse, or paste a screenshot with Ctrl+V</span>
        <small>Works best on a garment laid flat against a plain background.</small>
      </label>
      <canvas id="cv"></canvas>
      <div id="busy" class="busy" hidden>Tracing…</div>
    </div>
    <div id="toast" class="toast" hidden></div>
  </section>

  <aside class="panel steps">
    <h2>Cutting instructions</h2>
    <p class="hint" id="summary">Instructions appear here once an image is traced.</p>
    <ol id="instr"></ol>
  </aside>
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
